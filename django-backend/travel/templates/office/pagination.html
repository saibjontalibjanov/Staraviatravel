{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination">{% if page.has_previous %}<a class="button small secondary" href="?section={{ section }}&q={{ query|urlencode }}&status={{ status|urlencode }}&page={{ page.previous_page_number }}">← Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button small secondary" href="?section={{ section }}&q={{ query|urlencode }}&status={{ status|urlencode }}&page={{ page.next_page_number }}">Next →</a>{% endif %}</nav>{% endif %}
